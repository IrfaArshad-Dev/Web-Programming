<!DOCTYPE html>
<html lang="en">

<head>
    <title>Registration Form</title>
</head>

<body>

    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="User Logo" width="90" height="90">

    <h1>Registration Form</h1>
    <p>Please fill all the required fields</p>

    <form action="#" method="POST" id="myForm">

        <label for="fullname">Full Name *</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
        <br><br>

        <label for="email">Email *</label>
        <input type="email" id="email" name="email" placeholder="example@email.com" required>
        <br><br>

        <label for="password">Password *</label>
        <input type="password" id="password" name="password" placeholder="Min 8 characters" minlength="8" required>
        <br><br>

        <label for="confirm_password">Confirm Password *</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password"
            minlength="8" required>
        <br><br>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="+92 300 1234567" pattern="[0-9+ ]{10,15}">
        <br><br>

        <label for="age">Age</label>
        <input type="number" id="age" name="age" min="1" max="120" placeholder="Enter your age">
        <br><br>

        <label for="dob">Date of Birth</label>
        <input type="date" name="dob">
        <br><br>

        <label for="time">Preferred Time</label>
        <input type="time" id="time" name="time">
        <br><br>

        <label for="website">Website</label>
        <input type="url" id="website" name="website" placeholder="https://example.com">
        <br><br>

        <label for="search">Search</label>
        <input type="search" id="search" name="search" placeholder="Search here...">
        <br><br>

        <label for="country">Country</label>
        <select id="country" name="country">
            <option value="">-- Select Country --</option>
            <option value="pk">Pakistan</option>
            <option value="in">India</option>
            <option value="us">USA</option>
            <option value="uk">UK</option>
            <option value="other">Other</option>
        </select>
        <br><br>

        <label for="languages">Languages Known</label>
        <select id="languages" name="languages" multiple size="4">
            <option value="urdu">Urdu</option>
            <option value="english">English</option>
            <option value="hindi">Hindi</option>
            <option value="arabic">Arabic</option>
            <option value="punjabi">Punjabi</option>
        </select>
        <br><br>

        <label for="city">City</label>
        <input list="cities" id="city" name="city" placeholder="Select or type city">
        <datalist id="cities">
            <option value="Karachi">
            <option value="Lahore">
            <option value="Islamabad">
            <option value="Rawalpindi">
            <option value="Peshawar">
            <option value="Quetta">
        </datalist>
        <br><br>

        <label>Gender</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
        <br><br>

        <label>Skills</label>
        <input type="checkbox" id="html" name="skills" value="html">
        <label for="html">HTML</label>
        <input type="checkbox" id="css" name="skills" value="css">
        <label for="css">CSS</label>
        <input type="checkbox" id="js" name="skills" value="js">
        <label for="js">JavaScript</label>
        <input type="checkbox" id="python" name="skills" value="python">
        <label for="python">Python</label>
        <br><br>

        <label for="message">Message</label>
        <br>
        <textarea id="message" name="message" rows="5" cols="40" placeholder="Write your message here..."></textarea>
        <br><br>

        <fieldset>
            <legend>Address Information</legend>

            <label for="street">Street</label>
            <input type="text" id="street" name="street" placeholder="Street address">
            <br><br>

            <label for="zip">Zip Code</label>
            <input type="text" id="zip" name="zip" placeholder="Zip code" pattern="[0-9]{5}">
            <br><br>
        </fieldset>
        <br>

        <label for="file">Upload Profile Picture</label>
        <input type="file" id="file" name="file" accept="image/*">
        <br><br>

        <label for="files">Upload Documents (Multiple)</label>
        <input type="file" id="files" name="files" multiple>
        <br><br>

        <label for="experience">Experience Level: <span id="rangeValue">5</span>/10</label>
        <input type="range" id="experience" name="experience" min="0" max="10" value="5"
            oninput="document.getElementById('rangeValue').innerText = this.value">
        <br><br>

        <label for="favcolor">Favorite Color</label>
        <input type="color" id="favcolor" name="favcolor" value="#667eea">
        <br><br>

        <input type="hidden" id="user_id" name="user_id" value="12345">

        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the Terms & Conditions *</label>
        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

    <br>

    <p>© 2025 My Website | All Rights Reserved</p>

    <script>
        document.getElementById('myForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const pass = document.getElementById('password').value;
            const confirmPass = document.getElementById('confirm_password').value;

            if (pass !== confirmPass) {
                alert('Passwords do not match!');
                return;
            }

            alert('Form submitted successfully!');
        });

        document.getElementById('myForm').addEventListener('reset', function () {
            document.getElementById('rangeValue').innerText = '5';
        });
    </script>

</body>

</html>
